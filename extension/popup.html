<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RecallCard 浏览器扩展</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>RecallCard</h1><span>把资料带进当前对话</span></header>
  <p class="notice">先准备使用说明；模型需要资料时，粘贴它给出的完整资料请求。</p>
  <p id="status" role="status" aria-live="polite">正在确认当前标签页…</p>
  <div class="row"><button id="bootstrap" type="button">准备使用说明</button><button id="reset" class="secondary" type="button">重新连接当前对话</button></div>
  <details><summary>连接信息</summary><pre id="binding"></pre></details>
  <label for="action">模型的资料请求</label>
  <textarea id="action" rows="7" spellcheck="false" placeholder="粘贴完整 recallcard-action 代码块（含首尾标记）"></textarea>
  <button id="execute" type="button">查找资料</button>
  <label for="preview">资料预览</label>
  <textarea id="preview" readonly rows="10" spellcheck="false" aria-describedby="privacy"></textarea>
  <p id="privacy" class="muted">加入草稿后，当前网站即可读取这些资料。确认可以分享后，再在网页点击发送。</p>
  <div class="row"><button id="insert" type="button">加入草稿</button><button id="remove" class="secondary" type="button">移除已加入的资料</button></div>
  <button id="delivered" class="secondary" type="button">我已发送</button>
  <details><summary>使用帮助</summary><p class="muted">支持 ChatGPT，以及实验性 Qwen、Z.ai。切换对话后，请重新连接并准备使用说明。无法插入时，可复制预览中的资料。DeepSeek 暂未支持。</p></details>
  <script type="module" src="popup.js"></script>
</body>
</html>
