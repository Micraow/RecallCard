[package]
name = "recallcard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "本地优先、可追溯、可迁移的个人 AI 上下文与记忆层"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"

clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
dirs = "6"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes"] }
