name: Recovered native source validation
on:
  workflow_dispatch:
  push:
    branches: ["recovery/native-20261011"]
permissions:
  contents: read
concurrency:
  group: recovered-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ !contains(github.event.head_commit.message, '[candidate package]') && !contains(github.event.head_commit.message, '[package smoke]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_RETRY: '2'
      CARGO_HTTP_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Official native build and test dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth xdotool xclip scrot openbox dbus-x11 fonts-noto-cjk at-spi2-core python3-pyatspi
      - name: Frontend and protocol checks
        run: |
          python3 scripts/sync_version.py --check
          /usr/bin/python3 -m py_compile desktop/tests/connected_context_native.py
          /usr/bin/python3 -m unittest discover -s desktop/tests -p 'test_*.py'
          python3 -m unittest discover -s python/tests
          cd desktop
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:contracts
          npm test
          if grep -R -n 'demo_session\|mem_demo_\|__DEMO_CALLS__' dist; then exit 1; fi
      - name: Strict Rust and real core regression
        id: core_checks
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/recallcard-test-tmp" "$RUNNER_TEMP/recallcard-test-state"
          export TMPDIR="$RUNNER_TEMP/recallcard-test-tmp"
          export RECALLCARD_STATE_DIR="$RUNNER_TEMP/recallcard-test-state"
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --workspace --target-dir desktop/src-tauri/target
      - name: Build matching CLI and native GUI
        run: |
          cargo build --locked --release --bin recallcard --target-dir desktop/src-tauri/target
          cargo build --locked --release --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
          # Match the existing release packager: ship only public Python source beside the CLI.
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          root = Path('python')
          for package in ('recallcard_worker', 'recallcard_dream'):
              for source in (root / package).rglob('*.py'):
                  assert not source.is_symlink()
                  target = Path('desktop/src-tauri/target/release/python') / source.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read_bytes())
          PY
          git diff --exit-code -- Cargo.lock desktop/src-tauri/Cargo.lock
      - name: Fixed synthetic short-question source-hit comparison
        run: |
          /usr/bin/python3 scripts/eval_short_questions.py --binary desktop/src-tauri/target/release/recallcard --output "$RUNNER_TEMP/recallcard-short-question-eval"
      - name: Real connected native journey with synthetic data
        timeout-minutes: 10
        env:
          LANG: C.UTF-8
          GDK_BACKEND: x11
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1100x24" /usr/bin/python3 desktop/tests/connected_context_native.py --application desktop/src-tauri/target/release/recallcard-desktop --cli desktop/src-tauri/target/release/recallcard --artifacts "$RUNNER_TEMP/recallcard-native-evidence"
      - name: Keep only synthetic summary and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-native-summary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/recallcard-native-evidence/summary.json
            ${{ runner.temp }}/recallcard-short-question-eval/summary.json
            ${{ runner.temp }}/recallcard-native-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve core failures in final status
        if: always()
        run: test '${{ steps.core_checks.outcome }}' = 'success'
