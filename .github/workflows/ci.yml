name: 跨平台验证
on:
  workflow_dispatch:
  push:
    branches: ["validate/core-*"]
  pull_request:
    paths: ["crates/**", "Cargo.*", "python/**", "extension/**", ".github/workflows/ci.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          RECALLCARD_STATE_DIR: ${{ runner.temp }}/recallcard-state

  browser:
    name: 浏览器协议回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test extension/tests/*.test.js

  python:
    name: 可选 worker 与跨语言合同
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked --workspace
      - run: python3 -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python
          RECALLCARD_TEST_BINARY: ${{ github.workspace }}/target/debug/recallcard
          RECALLCARD_STATE_DIR: ${{ runner.temp }}/recallcard-python-state
      - run: python3 python/tests/check_rust_embedding_contract.py "$PWD/target/debug/recallcard"
        env:
          PYTHONPATH: python
          RECALLCARD_STATE_DIR: ${{ runner.temp }}/recallcard-python-state
