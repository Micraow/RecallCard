name: 桌面验证
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "crates/recallcard/**", ".github/workflows/desktop.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    name: Linux / Tauri 桌面
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: 安装系统依赖
        timeout-minutes: 16
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo build --locked --bin recallcard --target-dir desktop/src-tauri/target
  interface:
    name: 中文界面交互回归
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: node --test desktop/tests/*.test.js
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop/tests/local-dom
      - run: npm test
        working-directory: desktop/tests/local-dom
