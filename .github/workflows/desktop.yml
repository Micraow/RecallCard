name: 桌面 GUI 验证
on:
  push:
    paths:
      - 'desktop/**'
      - 'crates/recallcard/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/recallcard/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  linux:
    name: Linux / Tauri 桌面应用
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装官方系统依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
  interface:
    name: 中文界面交互回归
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extension
      - run: npx playwright install --with-deps chromium
        working-directory: extension
      - run: node --test desktop/tests/*.test.js desktop/tests/*.test.mjs
