name: 桌面 GUI 验证
on:
  workflow_dispatch:
  push:
    branches: ["validate/gui-*"]
    paths:
      - 'desktop/**'
      - 'crates/recallcard/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/recallcard/**'
      - '.github/workflows/desktop.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    name: Linux / Tauri 桌面应用
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装官方系统依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth xdotool scrot openbox dbus-x11 fonts-noto-cjk at-spi2-core python3-pyatspi
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: 编译合成资料库初始化 CLI
        run: cargo build --locked --bin recallcard --target-dir desktop/src-tauri/target
      - name: 安装官方 Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: 真实 Tauri GUI 与 Rust 后端端到端验证
        timeout-minutes: 8
        env:
          LANG: C.UTF-8
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1100x24" /usr/bin/python3 desktop/tests/native_smoke.py --artifacts "$RUNNER_TEMP/recallcard-native-smoke-artifacts"
      - name: 保存原生窗口截图与合成数据验证凭证
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recallcard-native-gui-linux
          path: ${{ runner.temp }}/recallcard-native-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
  interface:
    name: 中文界面交互回归
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extension
      - run: npx playwright install --with-deps chromium
        working-directory: extension
      - run: node --test desktop/tests/*.test.js desktop/tests/*.test.mjs
