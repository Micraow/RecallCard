name: 自动连接与文件入口验收
on:
  workflow_dispatch:
  push:
    branches: ["validate/connected-context-*"]
permissions:
  contents: read
concurrency:
  group: connected-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  journey:
    name: 真实项目配置 / 文件入口 / 同库 MCP
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_NET_RETRY: '2'
      CARGO_HTTP_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: 核对唯一版本来源与原生脚本语法
        run: |
          python3 scripts/sync_version.py --check
          python3 -m py_compile desktop/tests/connected_context_native.py
      - name: 构建实际内嵌的新界面
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:contracts
          if grep -R -n 'demo_session\|mem_demo_\|合成示例/RecallCard\|__DEMO_CALLS__' dist; then exit 1; fi
      - name: 核验系统 Python 3.10 的协议兼容性
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s python/tests -v
      - name: 安装官方原生依赖
        timeout-minutes: 16
        run: |
          source_list="$RUNNER_TEMP/recallcard-ubuntu-official.list"
          cat > "$source_list" <<'EOF'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu jammy-security main universe
          EOF
          apt_options=(-o "Dir::Etc::sourcelist=$source_list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2; do
            if sudo timeout --kill-after=30s 3m apt-get "${apt_options[@]}" --error-on=any update; then break; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
          done
          sudo timeout --kill-after=30s 8m apt-get "${apt_options[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth xdotool xclip scrot openbox dbus-x11 fonts-noto-cjk at-spi2-core python3-pyatspi
          fc-match 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK SC'
      - name: 核心协议与正本回归
        id: core_checks
        continue-on-error: true
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo test --locked --workspace --target-dir desktop/src-tauri/target
      - name: 原生静态检查
        id: native_checks
        continue-on-error: true
        run: |
          cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 编译同一源码的 GUI 与读取组件
        id: native_build
        run: |
          cargo build --locked --release --bin recallcard --target-dir desktop/src-tauri/target
          cargo build --locked --release --features custom-protocol --manifest-path desktop/src-tauri/Cargo.toml
          git diff --exit-code -- Cargo.lock desktop/src-tauri/Cargo.lock
      - name: 原生完整用户流程（仅合成资料）
        id: native_journey
        if: steps.native_build.outcome == 'success'
        timeout-minutes: 10
        env:
          LANG: C.UTF-8
          GDK_BACKEND: x11
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x1100x24" /usr/bin/python3 desktop/tests/connected_context_native.py --application desktop/src-tauri/target/release/recallcard-desktop --cli desktop/src-tauri/target/release/recallcard --artifacts "$RUNNER_TEMP/recallcard-v07-native-evidence"
      - name: 保存截图与本地 MCP 验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RecallCard-v07-connected-context-${{ github.sha }}
          path: ${{ runner.temp }}/recallcard-v07-native-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: 保存精确编译程序供诊断与后续候选包使用
        if: always() && steps.native_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RecallCard-v07-compiled-${{ github.sha }}
          path: |
            desktop/src-tauri/target/release/recallcard-desktop
            desktop/src-tauri/target/release/recallcard
          if-no-files-found: ignore
          retention-days: 7
      # 提前的回归失败不会遮住独立窗口证据，但绝不能因此得到成功或交付候选包。
      - name: 汇总全部必需门禁
        if: always()
        env:
          CORE_CHECKS: ${{ steps.core_checks.outcome }}
          NATIVE_CHECKS: ${{ steps.native_checks.outcome }}
          NATIVE_BUILD: ${{ steps.native_build.outcome }}
          NATIVE_JOURNEY: ${{ steps.native_journey.outcome }}
        run: |
          python3 - <<'PY'
          import os
          names = ['CORE_CHECKS', 'NATIVE_CHECKS', 'NATIVE_BUILD', 'NATIVE_JOURNEY']
          outcomes = {name: os.environ.get(name, 'missing') for name in names}
          for name, outcome in outcomes.items():
              print(f'{name}: {outcome}')
          if any(outcome != 'success' for outcome in outcomes.values()):
              raise SystemExit('必需门禁尚未全部通过；截图或程序仅供诊断，不能作为已验收候选包')
          PY
  connected-browser:
    name: 连接向导 / Chromium 合成异常与窄窗
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: 安装 Chromium 与官方中文字体
        timeout-minutes: 6
        run: |
          npx playwright install --with-deps chromium
          sudo timeout --kill-after=10s 3m apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-noto-cjk
      - name: 验证当前界面全部合成交互
        run: npm run test:frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RecallCard-v07-first-use-browser-${{ github.sha }}
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  browser-relay:
    name: 浏览器悬浮接力 / 长文续读 / 输入保护
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: 安装真实 Chromium 与系统依赖
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: 真实 DOM 合成接力（不打开真实账户、不发送消息）
        run: npm run test:browser
