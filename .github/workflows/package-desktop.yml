name: Linux 桌面安装包

on:
  workflow_dispatch:

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: AppImage 与 deb
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file

      - name: 构建桌面程序与 CLI
        run: |
          cargo build --locked --release --manifest-path desktop/src-tauri/Cargo.toml
          cargo build --locked --release --bin recallcard --target-dir desktop/src-tauri/target

      - name: 收集依赖许可证与设计说明
        run: |
          cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml \
            --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/gui-metadata.json"
          cargo metadata --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/cli-metadata.json"
          python3 scripts/collect_licenses.py \
            --metadata "$RUNNER_TEMP/gui-metadata.json" \
            --metadata "$RUNNER_TEMP/cli-metadata.json"

      - name: 打包 AppImage 与 deb
        working-directory: desktop
        run: npm exec --yes --package=@tauri-apps/cli@2.12.1 -- tauri bundle --config src-tauri/tauri.bundle.conf.json --bundles appimage,deb

      - name: 收集版本化安装包与校验清单
        run: python3 scripts/collect_desktop_bundles.py desktop/src-tauri/target/release/bundle desktop/release-artifacts "$GITHUB_SHA"

      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: RecallCard-linux-x86_64-${{ github.sha }}
          path: desktop/release-artifacts/
          if-no-files-found: error
          retention-days: 30
